services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iavid
      POSTGRES_PASSWORD: iavid
      POSTGRES_DB: iavid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iavid -d iavid']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iavid:iavid@postgres:5432/iavid?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    ports:
      - '3000:3000'
    volumes:
      - storage-data:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Les migrations sont appliquées au démarrage: l'app doit être utilisable
    # après un simple `docker compose up`, sans étape manuelle.
    command: >
      sh -c "npx prisma migrate deploy &&
             npx tsx prisma/seed.ts &&
             node server.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://iavid:iavid@postgres:5432/iavid?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      # Le même volume que l'app: le worker écrit les rendus que l'app sert.
      - storage-data:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: npx tsx src/worker/index.ts

volumes:
  postgres-data:
  redis-data:
  storage-data:
